[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-agent"
version = "0.1.0"
description = "Autonomous agent for code generation and modification"
requires-python = ">=3.11,<3.13"

dependencies = [
    # Web framework
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",

    # Config + env
    "pydantic>=2.7.4,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-dotenv==1.0.0",

    # HTTP
    "httpx>=0.28.1,<1.0",

    # Logging
    "structlog==24.1.0",

    # Auth
    "PyJWT==2.8.0",

    # Phase 3 — AST parsing
    "tree-sitter==0.23.2",
    "tree-sitter-python==0.23.2",
    "tree-sitter-javascript==0.23.1",

    # Phase 3 — Token counting
    "tiktoken==0.7.0",

    # Phase 3 — Embeddings + LLM
    "openai>=1.52.0,<2.0",
    "anthropic==0.28.0",
    "google-genai==1.16.0",

    # Phase 7 — Execution graph
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.2,<0.3",

    # Phase 3 — Vector store (direct psycopg2 writes to pgvector)
    "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.23.2",
    "black==23.12.0",
    "ruff==0.1.11",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
