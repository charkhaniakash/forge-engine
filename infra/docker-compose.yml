version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network



  redis:
    image: redis:7-alpine
    container_name: forge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: forge-backend
    environment:
      BACKEND_PORT: 8080
      AGENT_URL: http://agent:8000
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: debug
      JWT_SECRET: phase-0-insecure-default
      # GitHub App credentials (Phase 2)
      GITHUB_APP_ID: 4135365
      GITHUB_APP_NAME: ForgeRepoSync-Akash
      GITHUB_WEBHOOK_SECRET: forge-engine-super-secret-2025
      GITHUB_APP_PRIVATE_KEY_PATH: /app/secrets/github-private-key.pem
      GITHUB_INSTALL_STATE_SECRET: forge-engine-install-state-secret
      # Phase 3 — ingestion worker
      CLONE_BASE_DIR: /tmp/forge-clones
      WORKER_CONCURRENCY: 2
      # Phase 6 — execution sandbox
      SANDBOX_IMAGE: forge-sandbox:latest
      SANDBOX_CPU_LIMIT: "1.0"
      SANDBOX_MEMORY_LIMIT_MB: "2048"
      SANDBOX_PID_LIMIT: "128"
      SANDBOX_TIMEOUT_SECONDS: "1800"
      SANDBOX_REAPER_INTERVAL_SECONDS: "300"
    ports:
      - "8080:8080"
    volumes:
      - ./secrets/github-private-key.pem:/app/secrets/github-private-key.pem:ro
      - clone_storage:/tmp/forge-clones
      # Phase 6 — Docker socket mount so the backend can manage sandbox containers.
      # The backend is the ONLY component with Docker access.
      # The agent never touches Docker.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forge-network


  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: forge-agent

    # Load environment variables from agent/.env
    env_file:
      - ../agent/.env.local.example

    environment:
      AGENT_PORT: 8000
      BACKEND_URL: http://backend:8080
      LOG_LEVEL: debug
      JWT_SECRET: phase-0-insecure-default

      # Phase 3 — database (for direct pgvector writes)
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge

      # Phase 3 — embeddings
      EMBEDDING__PROVIDER: gemini
      EMBEDDING__MODEL: gemini-embedding-001
      EMBEDDING__DIMENSIONS: 3072
      EMBEDDING__BATCH_SIZE: 32
      CHUNK_TOKEN_LIMIT: 512
      # EMBEDDING__PROVIDER: openai
      # EMBEDDING__MODEL: text-embedding-3-small
      # EMBEDDING__DIMENSIONS: 1536

      # Phase 4 — chat
      CHAT__PROVIDER: gemini
      CHAT__MODEL: gemini-3.1-pro-preview
      # CHAT__PROVIDER: openai
      # CHAT__MODEL: gpt-4o-mini

      # Phase 4 — retrieval
      RETRIEVAL__CANDIDATE_K: 50
      RETRIEVAL__RERANK_K: 15
      RETRIEVAL__FINAL_K: 8
      RETRIEVAL__MAX_CHUNKS_PER_FILE: 3
      RETRIEVAL__CONTEXT_TOKEN_BUDGET: 4096
      RETRIEVAL__HISTORY_TURNS: 6

    ports:
      - "8000:8000"

    volumes:
      - clone_storage:/tmp/forge-clones:ro

    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

    networks:
      - forge-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: forge-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      VITE_AGENT_URL: http://localhost:8000
    depends_on:
      - backend
      - agent
    networks:
      - forge-network

  # Phase 6 — Build the forge-sandbox image once so the backend can use it.
  # This service exits immediately after building; it doesn't stay running.
  # Run `docker compose build sandbox-builder` to rebuild after Dockerfile changes.
  sandbox-builder:
    build:
      context: ../infra/sandbox
      dockerfile: Dockerfile
      tags:
        - forge-sandbox:latest
    image: forge-sandbox:latest
    container_name: forge-sandbox-builder
    command: echo "forge-sandbox image built"
    networks:
      - forge-network

  # Phase 8 — Language-specific sandbox images for validation.
  sandbox-go:
    build:
      context: ../infra/sandbox
      dockerfile: Dockerfile.go
      tags:
        - forge-sandbox-go:latest
    image: forge-sandbox-go:latest
    container_name: forge-sandbox-go-builder
    command: echo "forge-sandbox-go image built"
    networks:
      - forge-network
    depends_on:
      - sandbox-builder

  sandbox-node:
    build:
      context: ../infra/sandbox
      dockerfile: Dockerfile.node
      tags:
        - forge-sandbox-node:latest
    image: forge-sandbox-node:latest
    container_name: forge-sandbox-node-builder
    command: echo "forge-sandbox-node image built"
    networks:
      - forge-network
    depends_on:
      - sandbox-builder

  sandbox-python:
    build:
      context: ../infra/sandbox
      dockerfile: Dockerfile.python
      tags:
        - forge-sandbox-python:latest
    image: forge-sandbox-python:latest
    container_name: forge-sandbox-python-builder
    command: echo "forge-sandbox-python image built"
    networks:
      - forge-network
    depends_on:
      - sandbox-builder

volumes:
  postgres_data:
  clone_storage:

networks:
  forge-network:
    driver: bridge