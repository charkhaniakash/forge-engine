version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: forge-postgres
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network



  redis:
    image: redis:7-alpine
    container_name: forge-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forge-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: forge-backend
    environment:
      BACKEND_PORT: 8080
      AGENT_URL: http://agent:8000
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: debug
      JWT_SECRET: phase-0-insecure-default
      # GitHub App credentials (Phase 2)
      GITHUB_APP_ID: 4135365
      GITHUB_APP_NAME: ForgeRepoSync-Akash
      GITHUB_WEBHOOK_SECRET: forge-engine-super-secret-2025
      GITHUB_APP_PRIVATE_KEY_PATH: /app/secrets/github-private-key.pem
      GITHUB_INSTALL_STATE_SECRET: forge-engine-install-state-secret
      # Phase 3 — ingestion worker
      # This path must match the agent's mount point exactly.
      CLONE_BASE_DIR: /tmp/forge-clones
      WORKER_CONCURRENCY: 2
    ports:
      - "8080:8080"
    volumes:
      - ./secrets/github-private-key.pem:/app/secrets/github-private-key.pem:ro
      - clone_storage:/tmp/forge-clones
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forge-network

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    container_name: forge-agent
    environment:
      AGENT_PORT: 8000
      BACKEND_URL: http://backend:8080
      LOG_LEVEL: debug
      JWT_SECRET: phase-0-insecure-default
      # Phase 3 — database (for direct pgvector writes)
      DATABASE_URL: postgresql://forge:forge@postgres:5432/forge
      # Phase 3 — embeddings (Gemini is the default provider)
      EMBEDDING_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBEDDING_MODEL: models/text-embedding-004
      EMBEDDING_DIMENSIONS: 768
      EMBEDDING_BATCH_SIZE: 32
      CHUNK_TOKEN_LIMIT: 512
    ports:
      - "8000:8000"
    volumes:
      - clone_storage:/tmp/forge-clones:ro
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - forge-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: forge-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_BACKEND_URL: http://localhost:8080
      VITE_AGENT_URL: http://localhost:8000
    depends_on:
      - backend
      - agent
    networks:
      - forge-network

volumes:
  postgres_data:
  clone_storage:

networks:
  forge-network:
    driver: bridge